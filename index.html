<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>視力検査練習 | Eye Test Trainer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>視力検査練習</h1>
            <p class="subtitle">Landolt Ring Practice</p>
        </header>

        <main>
            <div class="test-area">
                <!-- 左側の向き変更・モード切替ボタン -->
                <div class="control-left">
                    <button id="btn-mode-toggle" title="モード切替" aria-label="モード切替">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path fill="currentColor" d="M12,18.17L8.83,15L7.42,16.41L12,21L16.59,16.41L15.17,15L12,18.17M12,5.83L15.17,9L16.59,7.59L12,3L7.41,7.59L8.83,9L12,5.83Z" />
                        </svg>
                    </button>
                    <button id="btn-rotate" title="向きを変える / 次の絵" aria-label="向きを変える">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path fill="currentColor" d="M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z" />
                        </svg>
                    </button>
                </div>

                <!-- 視標表示エリア -->
                <div class="landolt-container">
                    <div id="landolt-ring" class="landolt-ring level-3">
                        <svg viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="32" 
                                fill="none" 
                                stroke="black" 
                                stroke-width="16" 
                                stroke-dasharray="185 16.5" 
                                stroke-dashoffset="193" />
                        </svg>
                    </div>
                    <div id="animal-silhouette" class="animal-silhouette level-3 hidden">
                        <!-- ここに動物のSVGがJSで挿入されます -->
                    </div>
                </div>

                <!-- 右側のサイズ調整ボタン -->
                <div class="control-right">
                    <button id="btn-size-up" class="size-btn" title="大きくする" aria-label="大きくする">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path fill="currentColor" d="M7,14L12,9L17,14H7Z" />
                        </svg>
                    </button>
                    <div class="size-indicator">
                        <span id="current-size">3</span> / 5
                    </div>
                    <button id="btn-size-down" class="size-btn" title="小さくする" aria-label="小さくする">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path fill="currentColor" d="M7,10L12,15L17,10H7Z" />
                        </svg>
                    </button>
                </div>

                <!-- 判定表示用オーバーレイ -->
                <div id="feedback-overlay" class="feedback-overlay"></div>
            </div>

            <!-- 判定ボタン -->
            <div class="feedback-controls">
                <button id="btn-correct" class="feedback-btn correct" title="正解" aria-label="正解">○</button>
                <button id="btn-wrong" class="feedback-btn wrong" title="不正解" aria-label="不正解">×</button>
            </div>
        </main>

        <footer>
            <p>ボタンを押すか、キーボードの矢印キーで操作できます</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
